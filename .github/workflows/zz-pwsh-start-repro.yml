name: pwsh start repro (temporary, #267)

on:
  pull_request:
    paths:
      - .github/workflows/zz-pwsh-start-repro.yml

permissions: {}

jobs:
  node-starts:
    name: node starts pwsh (${{ matrix.runner }}, windowsHide ${{ matrix.hide }}, ${{ matrix.copy }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm]
        hide: ['0', '1']
        copy: [a, b, c]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Describe pwsh and node
        shell: bash
        run: |
          node --version
          pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString(); [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture; [Runtime.InteropServices.RuntimeInformation]::FrameworkDescription; [Environment]::ProcessPath'

      - name: Start pwsh 600 times from node, two at a time, each with a fresh USERPROFILE
        env:
          HIDE: ${{ matrix.hide }}
        shell: bash
        run: |
          node - <<'SCRIPT'
          const { spawn } = require("node:child_process");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const hide = process.env.HIDE === "1";
          const total = 400;
          const jumpLists = path.join(process.env.APPDATA, "Microsoft", "Windows", "Recent", "CustomDestinations");
          const jumpListState = () => fs.existsSync(jumpLists) ? fs.readdirSync(jumpLists).map(t => t + "@" + fs.statSync(path.join(jumpLists, t)).mtimeMs).join(",") : "none";
          const jumpListBefore = jumpListState();
          const root = fs.mkdtempSync(path.join(os.tmpdir(), "pwsh-starts-"));
          const codes = {};
          let failed = 0;
          const start = i => new Promise(resolve => {
            const profile = path.join(root, `p${i}`);
            fs.mkdirSync(profile);
            let output = "";
            const child = spawn("pwsh", ["-NoProfile", "-NonInteractive", "-Command", "Import-Module Microsoft.PowerShell.Utility, Microsoft.PowerShell.Management, Microsoft.PowerShell.Security; (Get-Command).Count; Start-Sleep -Milliseconds 1000"],
              { env: { ...process.env, USERPROFILE: profile }, windowsHide: hide, stdio: ["ignore", "pipe", "pipe"] });
            child.stdout.on("data", t => output += t);
            child.stderr.on("data", t => output += t);
            child.on("exit", code => {
              codes[code] = (codes[code] ?? 0) + 1;
              if (code !== 0 && failed++ < 3)
                console.log(`start ${i} exited with ${code}:\n${output}`);
              resolve();
            });
          });
          (async () => {
            for (let i = 0; i < total; i += 2)
              await Promise.all([start(i), start(i + 1)]);
            console.log(JSON.stringify({ windowsHide: hide, total, codes, jumpListWritten: jumpListState() !== jumpListBefore }));
            process.exitCode = failed === 0 ? 0 : 1;
          })();
          SCRIPT
