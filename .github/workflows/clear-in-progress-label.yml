name: Clear in-progress label

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  clear-label:
    name: Clear in-progress label
    if: contains(github.event.issue.labels.*.name, 'in progress')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove the in progress label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "in progress"
