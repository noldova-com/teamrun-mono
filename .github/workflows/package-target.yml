name: Package native target

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      architecture:
        required: true
        type: string
      revision:
        required: true
        type: string
      signed:
        description: Sign the installers with the release environment's credentials; macOS builds are also notarized
        required: false
        type: boolean
        default: false
    outputs:
      artifact-id:
        description: Exact installer artifact from this successful build
        value: ${{ jobs.package.outputs.artifact-id }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package ${{ inputs.platform }} ${{ inputs.architecture }}
    environment: ${{ inputs.signed && 'release' || '' }}
    outputs:
      artifact-id: ${{ steps.installers.outputs.artifact-id }}
    runs-on: >-
      ${{ fromJSON('{"windows-x64":"windows-2025","windows-arm64":"windows-11-arm",
      "linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm",
      "mac-x64":"macos-15-intel","mac-arm64":"macos-15"}')[format('{0}-{1}', inputs.platform, inputs.architecture)] }}
    timeout-minutes: ${{ inputs.signed && 90 || 45 }}
    env:
      CI: 'true'
      PACKAGE_PLATFORM: ${{ inputs.platform }}
      PACKAGE_ARCHITECTURE: ${{ inputs.architecture }}
      RELEASE_REVISION: ${{ inputs.revision }}
    steps:
      - name: Check out the run revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          architecture: ${{ inputs.architecture }}
          package-manager-cache: false

      - name: Verify toolchain and architecture
        run: |
          node --version
          npm --version
          test "$(node --version)" = v26.7.0
          test "$(npm --version)" = 11.19.0
          test "$(node --print process.arch)" = "$PACKAGE_ARCHITECTURE"

      - name: Install dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/teamrun-package"
          trap 'cat "$RUNNER_TEMP/teamrun-package/install.stdout.log"; cat "$RUNNER_TEMP/teamrun-package/install.stderr.log" >&2' EXIT
          {
            npm ci --no-audit --no-fund
            npm ci --prefix src/renderer --no-audit --no-fund
          } > "$RUNNER_TEMP/teamrun-package/install.stdout.log" 2> "$RUNNER_TEMP/teamrun-package/install.stderr.log"

      - name: Build packages and renderer
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-package/build.stdout.log"; cat "$RUNNER_TEMP/teamrun-package/build.stderr.log" >&2' EXIT
          npm run build > "$RUNNER_TEMP/teamrun-package/build.stdout.log" 2> "$RUNNER_TEMP/teamrun-package/build.stderr.log"

      - name: Prepare Electron runtime
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-package/electron.stdout.log"; cat "$RUNNER_TEMP/teamrun-package/electron.stderr.log" >&2' EXIT
          {
            node node_modules/electron/install.js
            npm run desktop -- --prepare-only
            if [ "$RUNNER_OS" = Linux ]; then
              sudo chown root:root node_modules/electron/dist/chrome-sandbox
              sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
              sudo chown root:root _build/electron-dev/chrome-sandbox
              sudo chmod 4755 _build/electron-dev/chrome-sandbox
            fi
          } > "$RUNNER_TEMP/teamrun-package/electron.stdout.log" 2> "$RUNNER_TEMP/teamrun-package/electron.stderr.log"

      - name: Verify packages, renderer and desktop UI
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-package/tests.stdout.log"; cat "$RUNNER_TEMP/teamrun-package/tests.stderr.log" >&2' EXIT
          {
            npm run test:build
            npm run test:release
            npm run test:package
            npm run test:desktop
            npm run test -- --skip-test-details --skip-coverage-details
            npm run test:renderer
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run --auto-servernum --server-args="-screen 0 2560x1440x24" npm run test:ui
            else
              npm run test:ui
            fi
          } > "$RUNNER_TEMP/teamrun-package/tests.stdout.log" 2> "$RUNNER_TEMP/teamrun-package/tests.stderr.log"

      - name: Build installers and integrity report
        env:
          PACKAGE_SIGNED: ${{ inputs.signed }}
          MAC_CERTIFICATE: ${{ inputs.signed && inputs.platform == 'mac' && secrets.MAC_CERTIFICATE || '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ inputs.signed && inputs.platform == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ inputs.signed && inputs.platform == 'mac' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ inputs.signed && inputs.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.signed && inputs.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          AZURE_TENANT_ID: ${{ inputs.signed && inputs.platform == 'windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ inputs.signed && inputs.platform == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ inputs.signed && inputs.platform == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          signing="$RUNNER_TEMP/teamrun-signing"
          trap 'rm -rf "$signing"; cat "$RUNNER_TEMP/teamrun-package/package.stdout.log"; cat "$RUNNER_TEMP/teamrun-package/package.stderr.log" >&2' EXIT
          arguments=(--platform "$PACKAGE_PLATFORM" --arch "$PACKAGE_ARCHITECTURE")
          if [ "$PACKAGE_SIGNED" = true ]; then
            arguments+=(--signed)
            if [ "$PACKAGE_PLATFORM" = mac ]; then
              export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
              if [ -n "$APPLE_API_KEY_P8" ]; then
                (umask 077 && mkdir "$signing" && printf '%s' "$APPLE_API_KEY_P8" > "$signing/api-key.p8")
                export APPLE_API_KEY="$signing/api-key.p8"
              fi
            fi
          fi
          npm run package -- "${arguments[@]}" > "$RUNNER_TEMP/teamrun-package/package.stdout.log" 2> "$RUNNER_TEMP/teamrun-package/package.stderr.log"
          if [ "$RUNNER_OS" = Linux ]; then
            appimages=("$GITHUB_WORKSPACE/_build/package/linux-$PACKAGE_ARCHITECTURE/"*.AppImage)
            test "${#appimages[@]}" -eq 1
            inspection=$(mktemp -d "$RUNNER_TEMP/teamrun-appimage.XXXXXX")
            (
              cd "$inspection"
              "${appimages[0]}" --appimage-extract AppRun
              "${appimages[0]}" --appimage-extract '*.desktop'
              cmp "$GITHUB_WORKSPACE/_build/appimage/$PACKAGE_ARCHITECTURE/AppRun" squashfs-root/AppRun
              grep -Fx 'Exec=AppRun %U' squashfs-root/*.desktop
            ) >> "$RUNNER_TEMP/teamrun-package/package.stdout.log" 2>> "$RUNNER_TEMP/teamrun-package/package.stderr.log"
          fi
          if [ "$PACKAGE_SIGNED" = true ] && [ "$PACKAGE_PLATFORM" = mac ]; then
            apps=("$GITHUB_WORKSPACE/_build/package/mac-$PACKAGE_ARCHITECTURE/"*/TeamRun.app)
            test "${#apps[@]}" -eq 1 && test -d "${apps[0]}"
            assessment="$RUNNER_TEMP/teamrun-package/gatekeeper.log"
            {
              codesign --verify --deep --strict --verbose=2 "${apps[0]}"
              spctl --assess --type execute --verbose=2 "${apps[0]}" 2> "$assessment"
              xcrun stapler validate "${apps[0]}"
            } >> "$RUNNER_TEMP/teamrun-package/package.stdout.log" 2>> "$RUNNER_TEMP/teamrun-package/package.stderr.log"
            cat "$assessment" >> "$RUNNER_TEMP/teamrun-package/package.stdout.log"
            grep -qF 'source=Notarized Developer ID' "$assessment"
          fi
          if [ "$PACKAGE_SIGNED" = true ] && [ "$PACKAGE_PLATFORM" = windows ]; then
            executables=("_build/package/windows-$PACKAGE_ARCHITECTURE/TeamRun-windows-$PACKAGE_ARCHITECTURE.exe" "_build/package/windows-$PACKAGE_ARCHITECTURE/"win*-unpacked/TeamRun.exe)
            test "${#executables[@]}" -eq 2 && test -f "${executables[0]}" && test -f "${executables[1]}"
            SIGNED_FILES="${executables[*]}" powershell -NoProfile -NonInteractive -Command '
              $failed = $false
              foreach ($file in $env:SIGNED_FILES -split " ") {
                $signature = Get-AuthenticodeSignature -LiteralPath $file
                "{0}: {1}; signer {2}; timestamped {3}" -f $file, $signature.Status, $signature.SignerCertificate.Subject, ($null -ne $signature.TimeStamperCertificate)
                if ($signature.Status -ne "Valid" -or $null -eq $signature.TimeStamperCertificate) { $failed = $true }
              }
              if ($failed) { exit 1 }' >> "$RUNNER_TEMP/teamrun-package/package.stdout.log" 2>> "$RUNNER_TEMP/teamrun-package/package.stderr.log"
          fi

      - name: Retain installers and reports
        id: installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ inputs.platform }}-${{ inputs.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/package/${{ inputs.platform }}-${{ inputs.architecture }}/TeamRun-*
            _build/package/${{ inputs.platform }}-${{ inputs.architecture }}/*.yml
            !_build/package/${{ inputs.platform }}-${{ inputs.architecture }}/builder-*.yml
            _build/package/${{ inputs.platform }}-${{ inputs.architecture }}/package-report-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain diagnostics
        id: ui-report
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-logs-${{ inputs.platform }}-${{ inputs.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/teamrun-package/*.log
            _build/ui-results/
            _build/ui-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Retain main-window screenshot
        id: ui-main-window
        if: always() && !cancelled() && hashFiles('_build/ui-results/main-window.png') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-main-window-${{ inputs.platform }}-${{ inputs.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}.png
          path: _build/ui-results/main-window.png
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Link desktop UI evidence in the summary
        if: always() && !cancelled()
        env:
          UI_REPORT_URL: ${{ steps.ui-report.outputs.artifact-url }}
          UI_MAIN_WINDOW_URL: ${{ steps.ui-main-window.outputs.artifact-url }}
        run: |
          {
            if [ ! -f _build/ui-results/summary.md ]; then
              printf '\n### Desktop UI\n\nUI results were not produced. Check the preceding job steps.\n'
            fi
            printf '\n#### UI evidence\n\n'
            if [ -n "$UI_MAIN_WINDOW_URL" ]; then
              printf '[View main window (PNG)](%s)\n\n' "$UI_MAIN_WINDOW_URL"
            else
              printf 'Main-window screenshot was not captured or uploaded.\n\n'
            fi
            if [ -n "$UI_REPORT_URL" ]; then
              printf '[Download the full UI report, screenshots and traces](%s)\n\n' "$UI_REPORT_URL"
            else
              printf 'The full UI artifact is unavailable.\n\n'
            fi
            printf 'Artifacts are retained for seven days.\n'
          } >> "$GITHUB_STEP_SUMMARY"
