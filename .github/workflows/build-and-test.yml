name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Build and test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux x64
            runner: ubuntu-24.04
            architecture: x64
          - target: Linux ARM64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - target: Windows x64
            runner: windows-2025
            architecture: x64
          - target: Windows ARM64
            runner: windows-11-arm
            architecture: arm64
          - target: macOS x64
            runner: macos-15-intel
            architecture: x64
          - target: macOS ARM64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          architecture: ${{ matrix.architecture }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/renderer/package-lock.json

      - name: Verify toolchain versions and architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          node --version
          npm --version
          node --print "process.platform + '/' + process.arch"
          test "$(node --version)" = v26.7.0
          test "$(npm --version)" = 11.19.0
          test "$(node --print process.arch)" = "$EXPECTED_ARCHITECTURE"
          mkdir -p "$RUNNER_TEMP/teamrun-ci"

      - name: Restore installed dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            src/renderer/node_modules
          key: dependencies-${{ runner.os }}-${{ matrix.architecture }}-node-26.7.0-npm-11.19.0-${{ hashFiles('package.json', 'package-lock.json', 'src/renderer/package.json', 'src/renderer/package-lock.json') }}

      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/install.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/install.stderr.log" >&2' EXIT
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/teamrun-ci/install.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/install.stderr.log"

      - name: Install renderer dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: src/renderer
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/renderer-install.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/renderer-install.stderr.log" >&2' EXIT
          npm ci --no-audit --no-fund --timing --logs-dir "$RUNNER_TEMP/teamrun-ci/npm-renderer" > "$RUNNER_TEMP/teamrun-ci/renderer-install.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/renderer-install.stderr.log"

      - name: Save installed dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            src/renderer/node_modules
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Build packages and renderer
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/build.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/build.stderr.log" >&2' EXIT
          npm run build > "$RUNNER_TEMP/teamrun-ci/build.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/build.stderr.log"

      - name: Prepare Electron runtime
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/electron.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/electron.stderr.log" >&2' EXIT
          {
            node node_modules/electron/install.js
            npm run desktop -- --prepare-only
            if [ "$RUNNER_OS" = Linux ]; then
              sudo chown root:root node_modules/electron/dist/chrome-sandbox
              sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
              sudo chown root:root _build/electron-dev/chrome-sandbox
              sudo chmod 4755 _build/electron-dev/chrome-sandbox
            fi
          } > "$RUNNER_TEMP/teamrun-ci/electron.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/electron.stderr.log"

      - name: Type-check repository scripts
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/typecheck.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/typecheck.stderr.log" >&2' EXIT
          node node_modules/typescript/bin/tsc --project scripts/tsconfig.json > "$RUNNER_TEMP/teamrun-ci/typecheck.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/typecheck.stderr.log"
          node node_modules/typescript/bin/tsc --project src/desktop/tests/e2e/tsconfig.json >> "$RUNNER_TEMP/teamrun-ci/typecheck.stdout.log" 2>> "$RUNNER_TEMP/teamrun-ci/typecheck.stderr.log"

      - name: Run package tests and coverage gate
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/test.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/test.stderr.log" >&2' EXIT
          npm run test -- --skip-test-details --skip-coverage-details > "$RUNNER_TEMP/teamrun-ci/test.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/test.stderr.log"

      - name: Check release contracts
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/release.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/release.stderr.log" >&2' EXIT
          npm run test:release > "$RUNNER_TEMP/teamrun-ci/release.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/release.stderr.log"

      - name: Check packaging contracts
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/package.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/package.stderr.log" >&2' EXIT
          npm run test:package > "$RUNNER_TEMP/teamrun-ci/package.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/package.stderr.log"

      - name: Check desktop tooling
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/desktop.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/desktop.stderr.log" >&2' EXIT
          npm run test:desktop > "$RUNNER_TEMP/teamrun-ci/desktop.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/desktop.stderr.log"

      - name: Run renderer tests
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/renderer.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/renderer.stderr.log" >&2' EXIT
          npm run test:renderer > "$RUNNER_TEMP/teamrun-ci/renderer.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/renderer.stderr.log"

      - name: Run desktop UI workflows
        env:
          RUNNER_PLATFORM: ${{ runner.os }}
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-ci/ui.stdout.log"; cat "$RUNNER_TEMP/teamrun-ci/ui.stderr.log" >&2' EXIT
          if [ "$RUNNER_PLATFORM" = Linux ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 2560x1440x24" npm run test:ui > "$RUNNER_TEMP/teamrun-ci/ui.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/ui.stderr.log"
          else
            npm run test:ui > "$RUNNER_TEMP/teamrun-ci/ui.stdout.log" 2> "$RUNNER_TEMP/teamrun-ci/ui.stderr.log"
          fi

      - name: Retain desktop screenshots and traces
        id: ui-report
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-${{ matrix.runner }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: |
            _build/ui-results/
            _build/ui-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Retain main-window screenshot
        id: ui-main-window
        if: always() && !cancelled() && hashFiles('_build/ui-results/main-window.png') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-main-window-${{ matrix.runner }}-${{ matrix.architecture }}-${{ github.run_attempt }}.png
          path: _build/ui-results/main-window.png
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Link desktop UI evidence in the summary
        if: always() && !cancelled()
        env:
          UI_REPORT_URL: ${{ steps.ui-report.outputs.artifact-url }}
          UI_MAIN_WINDOW_URL: ${{ steps.ui-main-window.outputs.artifact-url }}
        run: |
          {
            if [ ! -f _build/ui-results/summary.md ]; then
              printf '\n### Desktop UI\n\nUI results were not produced. Check the preceding job steps.\n'
            fi
            printf '\n#### UI evidence\n\n'
            if [ -n "$UI_MAIN_WINDOW_URL" ]; then
              printf '[View main window (PNG)](%s)\n\n' "$UI_MAIN_WINDOW_URL"
            else
              printf 'Main-window screenshot was not captured or uploaded.\n\n'
            fi
            if [ -n "$UI_REPORT_URL" ]; then
              printf '[Download the full UI report, screenshots and traces](%s)\n\n' "$UI_REPORT_URL"
            else
              printf 'The full UI artifact is unavailable.\n\n'
            fi
            printf 'Artifacts are retained for seven days.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain diagnostic logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.runner }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/teamrun-ci/*.log
            ${{ runner.temp }}/teamrun-ci/npm-renderer/
          if-no-files-found: warn
          retention-days: 7

  validation-result:
    name: Build and test (all targets)
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require every target to pass
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
