<h2 class="tr-settings-title">{{ resources.terminalTitle }}</h2>
<tr-settings-row [label]="resources.defaultShellLabel" [hint]="resources.defaultShellHint">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="tr-select">
    <mat-select class="tr-default-shell-select" [aria-label]="resources.defaultShellLabel" [value]="terminals.defaultShell()?.id"
      (valueChange)="preferences.setDefaultShellId($event)">
      @for (shell of terminals.shells(); track shell.id) {
        <mat-option [value]="shell.id">{{ shell.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</tr-settings-row>
<tr-settings-row [label]="resources.terminalOutputLimitLabel" [hint]="resources.terminalOutputLimitHint">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="tr-field">
    <input matInput type="number" class="tr-terminal-output-limit" [attr.aria-label]="resources.terminalOutputLimitLabel"
      [attr.aria-invalid]="outputLimitInvalid()" [min]="resources.minimumTerminalOutputLimit" [max]="resources.maximumTerminalOutputLimit"
      step="1" [value]="preferences.terminalOutputLimit()" #outputLimit (change)="setOutputLimit(outputLimit.valueAsNumber)">
  </mat-form-field>
  <span>{{ resources.terminalOutputLimitUnit }}</span>
  @if (outputLimitInvalid()) { <p class="tr-error" role="alert">{{ resources.terminalOutputLimitInvalid }}</p> }
</tr-settings-row>
