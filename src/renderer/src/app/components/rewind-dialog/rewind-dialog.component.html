<h2 mat-dialog-title>{{ resources.rewindTitle }}</h2>
<mat-dialog-content>
  <p class="mt-0">{{ resources.rewindText }}</p>
  <mat-checkbox class="mt-[var(--tr-space-3)] block" [checked]="restoreFiles()" (change)="restoreFiles.set($event.checked)">{{ resources.restoreFilesLabel }}</mat-checkbox>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>{{ resources.closeLabel }}</button>
  <button mat-flat-button type="button" cdkFocusInitial (click)="confirm()">{{ resources.rewindConfirmLabel }}</button>
</mat-dialog-actions>
