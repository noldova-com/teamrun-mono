<div class="mb-1 mt-3 flex items-center gap-2 tr-muted">
  <span>{{ formatter.authorLabel(item().summary.preview, chat.providers()) }}</span>
  <span>{{ formatter.time(item().summary.preview.createdAt) }}</span>
</div>
@if (panel() === activityPanel) {
  <tr-activity-block [entries]="entries()" [label]="formatter.activitySummary(entries(), item().summary.files.length)" [rootPath]="rootPath()"
    [expansion]="item().expansion" [beforeExpand]="ensureDetails" />
} @else {
  <tr-edited-files-card [edits]="item().summary.files" [fullEdits]="edits()" [rootPath]="rootPath()"
    [expansion]="item().expansion" [beforeExpand]="ensureDetails" />
}
@if (loading()) { <p class="tr-muted tr-raised pointer-events-none absolute bottom-0 right-0 p-1" role="status">{{ resources.replyHistoryLoading }}</p> }
@if (error(); as error) {
  <p class="tr-error py-1" role="alert">{{ error }}</p>
  <button type="button" class="tr-muted" (click)="ensureDetails()">{{ resources.replyHistoryRetry }}</button>
}
